<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/caw.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kauwe Bende">
    <link rel="apple-touch-icon" href="/public/icons/icon-152x152.png">
    <title>Kauwe Bende</title>
  </head>
  <body>
    <div id="question-panel" class="hidden">
      <h1 id="question-title" class="panel-item"></h1>
      <div id="question-text" class="panel-item">
        🤖 Vraag is aan het laden... 🤖
      </div>
      <button id="speak-question">🔊 Lees voor</button>
      <button id="reroll-question" style="display: none;">🎲 Andere vraag</button>
      <button id="close-question-panel" class="panel-item">Sluit</button>
    </div>

    <button id="rules-button" class="floating-btn">📖 Spelregels</button>
    
    <div id="rules-modal" class="rules-modal hidden">
      <div class="rules-modal-content">
        <button id="close-rules" class="close-rules-btn">&times;</button>
        <div id="rules-content"></div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
